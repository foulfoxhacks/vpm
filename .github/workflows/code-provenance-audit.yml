
name: Code Provenance and Residual Signature Audit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  provenance-audit:
    name: Scan repository for provenance markers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan source files
        shell: bash
        run: |
          mkdir -p audit-results

          REPORT="audit-results/provenance-report.txt"

          echo "CODE PROVENANCE AUDIT" > "$REPORT"
          echo "Repository: $GITHUB_REPOSITORY" >> "$REPORT"
          echo "Commit: $GITHUB_SHA" >> "$REPORT"
          echo "Date: $(date -u)" >> "$REPORT"
          echo "" >> "$REPORT"

          echo "=== EXPLICIT AI ATTRIBUTION ===" >> "$REPORT"

          git grep -n -I -i -E \
            'AI-generated|AI generated|Generated by (Claude|ChatGPT|Copilot|Gemini)|Co-Authored-By:.*(Claude|Copilot|ChatGPT|OpenAI)' \
            HEAD -- \
            '*.py' '*.js' '*.ts' '*.tsx' '*.jsx' \
            '*.java' '*.kt' '*.cs' '*.cpp' '*.h' \
            '*.rs' '*.go' '*.php' '*.rb' '*.swift' \
            '*.svelte' '*.vue' '*.html' '*.css' \
            '*.md' '*.json' '*.yaml' '*.yml' \
            >> "$REPORT" || true

          echo "" >> "$REPORT"
          echo "=== GENERATED FILE MARKERS ===" >> "$REPORT"

          git grep -n -I -i -E \
            'DO NOT EDIT|AUTO-GENERATED|AUTOGENERATED|generated file|generated by' \
            HEAD -- \
            '*.py' '*.js' '*.ts' '*.json' '*.yaml' '*.yml' \
            '*.php' '*.cs' '*.java' '*.kt' '*.rs' '*.go' \
            '*.svelte' '*.vue' '*.html' '*.css' \
            >> "$REPORT" || true

          echo "" >> "$REPORT"
          echo "=== PLACEHOLDERS AND INCOMPLETE IMPLEMENTATIONS ===" >> "$REPORT"

          git grep -n -I -E \
            'TODO|FIXME|XXX|PLACEHOLDER|IMPLEMENT ME|YOUR_API_KEY|INSERT_API_KEY|example\.com' \
            HEAD -- \
            '*.py' '*.js' '*.ts' '*.tsx' '*.jsx' \
            '*.java' '*.kt' '*.cs' '*.rs' '*.go' '*.php' \
            '*.rb' '*.swift' '*.svelte' '*.vue' \
            >> "$REPORT" || true

          echo "" >> "$REPORT"
          echo "=== COMMIT ATTRIBUTION ===" >> "$REPORT"

          git log -100 --format='%h %an <%ae> %s%n%b' \
            | grep -i -E \
            'Co-Authored-By:|Claude|ChatGPT|Copilot|OpenAI|Gemini' \
            >> "$REPORT" || true

          echo "" >> "$REPORT"
          echo "=== TRACKED BUILD AND GENERATED ARTIFACTS ===" >> "$REPORT"

          git ls-files \
            | grep -E \
            '(^|/)(\.svelte-kit|node_modules|dist|build|coverage|\.next|\.nuxt|\.cloudflare|vendor)/|(\.min\.js|\.min\.css)$' \
            >> "$REPORT" || true

          echo "" >> "$REPORT"
          echo "=== SUMMARY ===" >> "$REPORT"
          echo "Review every finding before making changes." >> "$REPORT"
          echo "No source files were modified." >> "$REPORT"

          cat "$REPORT"

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-provenance-audit
          path: audit-results/
          retention-days: 30
